name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'AISWatch/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: NDK · CMake 설치 + 라이선스 동의
        run: |
          SDKMGR="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Gradle 설치
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Debug APK 빌드
        working-directory: AISWatch
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK 업로드 (Artifacts에서 다운로드)
        uses: actions/upload-artifact@v4
        with:
          name: AtoN-AIS-debug-apk
          path: AISWatch/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
